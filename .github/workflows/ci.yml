name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: leafo/gh-actions-lua@v13.1.0
        with:
          luaVersion: "luajit-2.1"

      - uses: leafo/gh-actions-luarocks@v6.1.1

      - name: Install busted and luacheck
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: Install stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --version

      - name: Parse deploy.ps1
        run: |
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/deploy.ps1", [ref]$null, [ref]$errors) > $null; if ($errors) { $errors; exit 1 }'

      - name: Install lua-language-server
        run: |
          mkdir -p "$HOME/luals"
          curl -sSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz \
            | tar -xz -C "$HOME/luals"
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"

      - name: Fetch WoW API annotations
        run: tools/fetch_annotations.sh

      - name: Full verification
        run: tools/check.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check TOC version matches tag
        run: |
          toc_version="$(sed -n 's/^## Version: //p' addon/LaRutaDel60/LaRutaDel60.toc | tr -d '\r')"
          if [ "v$toc_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $toc_version" >&2
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          (cd addon && zip -r "../dist/LaRutaDel60-$GITHUB_REF_NAME.zip" LaRutaDel60)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
